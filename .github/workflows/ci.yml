name: CI

on:
  push:
  pull_request:

# The scheduled refresh of the fresh benchmark is added in Phase 8, once the
# leaderboard exists to publish into.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.4"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Network-marked tests are excluded: CI must not depend on a third-party
      # API being up, and it has no GPU or time budget for a real sweep.
      - name: Tests
        run: uv run pytest -m "not network" -q
