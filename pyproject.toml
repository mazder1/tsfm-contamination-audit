[project]
name = "tsfm-audit"
version = "0.1.0"
description = "Contamination audit of time-series foundation models"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "requests>=2.32,<3.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
# Classical + supervised baselines (Phase 2)
stats = [
    "statsforecast>=1.7,<2.0",
    "utilsforecast>=0.2",
    "scipy>=1.13",
]
# Foundation models (Phase 1). Large download; installed on demand.
models = [
    "torch>=2.2",
    "transformers>=4.40",
    "chronos-forecasting>=1.4",
]
# Published-benchmark reproduction (Phase 1). Pulls the Chronos eval datasets.
eval = [
    "datasets>=2.18",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# PyTorch's default PyPI wheel is CPU-only on Windows, which made the Phase 1
# sweep a ~62 hour job on a machine with an idle RTX 3070. Pull the CUDA build
# instead. cu126 rather than cu130: a CUDA 13.x driver runs it via backward
# compatibility, and it is the better-trodden path for Ampere.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access",
]
